services:
  postgres:
    image: postgres:16
    container_name: medsync-postgres
    environment:
      POSTGRES_DB: medsync_db
      POSTGRES_USER: medsync_user
      POSTGRES_PASSWORD: medsync_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medsync-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: medsync-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - medsync-network

  app:
    build: .
    container_name: medsync-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medsync_db
      SPRING_DATASOURCE_USERNAME: medsync_user
      SPRING_DATASOURCE_PASSWORD: medsync_pass
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: mySecretKey123456789012345678901234567890
      JWT_EXPIRATION: 86400000
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - medsync-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  medsync-network:
    driver: bridge
