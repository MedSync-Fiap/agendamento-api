server:
  port: 8080

spring:
  application:
    name: medsync-cadastro-agendamento
  
  profiles:
    active: dev
  
  graphql:
    graphiql:
      enabled: false
    path: /graphql
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.graphql.GraphQlAutoConfiguration
      - org.springframework.boot.autoconfigure.graphql.servlet.GraphQlWebMvcAutoConfiguration
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medsync_db}
    username: ${DB_USERNAME:medsync_user}
    password: ${DB_PASSWORD:medsync_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    encoding: UTF-8
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: UTC

# Configurações da aplicação
app:
  name: medsync-cadastro-agendamento
  version: 1.0.0
  security:
    jwt:
      issuer: ${JWT_ISSUER:medsync-agendamento-api}
      audience: ${JWT_AUDIENCE:medsync-historico-api}
      private:
        key: ${JWT_PRIVATE_KEY_PATH:classpath:certs/private_key.pem}
      public:
        key: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
      secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
      expiration: 86400000
  historico:
    graphql:
      url: ${HISTORICO_GRAPHQL_URL:http://localhost:8081/graphql}
  rabbitmq:
    exchange-consultas: ex_consultas
    queue-notificacoes: q_notificacoes_consultas
    routing-key-notificacoes: consulta.notificacao

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    enabled: true
  show-actuator: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.medsync: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medsync_db}
    username: ${DB_USERNAME:medsync_user}
    password: ${DB_PASSWORD:medsync_pass}

---
spring:
  config:
    activate:
      on-profile: test
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medsync_test_db}
    username: ${DB_USERNAME:medsync_test_user}
    password: ${DB_PASSWORD:medsync_test_pass}
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  services:
    historico:
      url: http://localhost:8081
    notificacao:
      url: http://localhost:8082

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      historico-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
      notificacao-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      historico-service:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.lang.Exception
      notificacao-service:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.lang.Exception

# Feign Configuration
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: basic
      historico-service:
        url: http://localhost:8081
      notificacao-service:
        url: http://localhost:8082
  hystrix:
    enabled: false
