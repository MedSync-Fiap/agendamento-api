version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: medsync-postgres-dev
    environment:
      POSTGRES_DB: medsync_db
      POSTGRES_USER: medsync_user
      POSTGRES_PASSWORD: medsync_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medsync-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsync_user -d medsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: medsync-mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: medsync
      MONGO_INITDB_ROOT_PASSWORD: medsync_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medsync-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: medsync-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - medsync-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: medsync-mailhog-dev
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - medsync-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:

networks:
  medsync-network:
    driver: bridge

